<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>网页版 Minecraft 1.8</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>网页版 Minecraft 1.8</h1>
      <p class="sub">一个域名、两套 1.8 客户端，连同一台生存服。请手动选择版本，本页不会自动跳转。</p>

      <nav class="actions">
        <a class="btn" href="../js/">普通版（推荐）</a>
        <a class="btn secondary" href="../wasm/">高性能版 WASM</a>
      </nav>

      <section class="notes">
        <p>iPad / 手机请用普通版。电脑上的 Chrome 可以再试高性能版 WASM。</p>
        <p>默认服务器已是本服（CQ 生存：<code>wss://mc.cq.je</code>）。也可以打开 play.mc.js.cool/1.8，在多人游戏里手动填写 <code>wss://mc.cq.je</code>。</p>
      </section>
    </main>
  </body>
</html>
