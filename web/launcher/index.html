<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>网页版 Minecraft 1.8</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>网页版 Minecraft 1.8</h1>
      <p class="sub">一个域名、两套 1.8 客户端，连同一台服。请手动选择版本，本页不会自动跳转。</p>

      <nav class="actions" id="actions">
        <a class="btn" id="btn-js" href="/play/">普通版（推荐）</a>
        <span class="btn disabled" id="btn-wasm-off">高性能版 WASM（暂未部署）</span>
        <a class="btn secondary hidden" id="btn-wasm" href="/wasm/">高性能版 WASM</a>
      </nav>

      <section class="notes">
        <p><strong>iPad / 手机请用普通版。</strong>电脑 Chrome 以后可试高性能版 WASM（须先编译部署）。</p>
        <p>默认多人服务器：<code>wss://mc.cq.je/</code>（CQ 创造服）。</p>
        <p id="build-note">当前普通版指向现网可玩页面 <code>/play/</code>（含中文聊天与登录）。<code>/js/</code>、<code>/wasm/</code> 编译部署后会自动切换入口。</p>
      </section>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
